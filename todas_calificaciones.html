<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Todas las calificaciones - BuscoTec</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver</a>
    <h4 class="mb-1" id="tituloProfesional">Todas las calificaciones</h4>
    <p id="subTitulo" class="text-muted mb-3"></p>
    <div id="listaTodas" class="mt-3"></div>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const profesionalId = params.get("id");

  const tituloProfesional = document.getElementById("tituloProfesional");
  const subTitulo = document.getElementById("subTitulo");

  if (!profesionalId) {
    document.getElementById("listaTodas").innerHTML = 
      `<div class="alert alert-danger">ID del profesional inválido.</div>`;
  } else {
    // 🔹 Obtener nombre del profesional
    fetch(`backend/get_profesional.php?id=${profesionalId}`)
      .then(r => r.json())
      .then(data => {
        if (data && !data.error) {
          const nombreCompleto = `${data.nombre || ''} ${data.apellido || ''}`.trim();
          tituloProfesional.textContent = `Calificaciones de ${nombreCompleto || 'profesional'}`;
          subTitulo.textContent = data.categorias?.[0]?.nombre 
            ? `Especialidad: ${data.categorias[0].nombre}` 
            : '';
        }
      })
      .catch(err => console.warn("No se pudo obtener el profesional:", err));

    // 🔹 Obtener promedio general
    fetch(`backend/get_rating.php?id=${profesionalId}`)
      .then(r => r.json())
      .then(j => {
        if (j.ok) {
          const promedio = parseFloat(j.promedio || 0).toFixed(1);
          const estrellas = "★".repeat(Math.round(promedio)).padEnd(5, "☆");
          const total = j.total || 0;
          tituloProfesional.innerHTML += ` 
            <span class="text-warning fs-5 ms-2">${estrellas}</span>
            <span class="fw-bold text-warning">(${promedio})</span>
            <small class="text-muted ms-1">${total} calificación(es)</small>`;
        }
      })
      .catch(err => console.warn("Error obteniendo promedio:", err));

    // 🔹 Obtener todas las calificaciones completas
    fetch(`backend/get_calificaciones_profesional.php?id=${profesionalId}&all=1`)
      .then(r => r.json())
      .then(j => {
        const cont = document.getElementById("listaTodas");
        if (!j.ok) {
          cont.innerHTML = `<div class="alert alert-danger">${j.error}</div>`;
          return;
        }

        if (!j.items.length) {
          cont.innerHTML = `<div class="alert alert-light border text-center">Aún no hay calificaciones.</div>`;
          return;
        }

        cont.innerHTML = j.items.map(c => `
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong>${c.nombre || 'Usuario'} ${c.apellido || ''}</strong>
                <span class="text-warning">${"★".repeat(Math.round(c.puntuacion)).padEnd(5,"☆")}</span>
              </div>
              ${c.comentario ? `<p class="mb-1">${c.comentario}</p>` : ""}
              <small class="text-muted">${c.fecha}</small>
            </div>
          </div>
        `).join("");
      })
      .catch(err => {
        document.getElementById("listaTodas").innerHTML =
          `<div class="alert alert-danger">Error cargando calificaciones.</div>`;
        console.error(err);
      });
  }
  </script>
</body>
</html>
