<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | BuscoTec</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<div class="container my-5">
  <h3>Restablecer contraseña</h3>
  <p>Ingresa tu nueva contraseña.</p>

  <form id="formReset">
    <div class="mb-3">
      <label for="password" class="form-label">Nueva contraseña</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div class="mb-3">
      <label for="confirm" class="form-label">Confirmar contraseña</label>
      <input type="password" class="form-control" id="confirm" required>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>

<script>
document.getElementById('formReset').addEventListener('submit', async function(e) {
  e.preventDefault();

  const password = document.getElementById('password').value.trim();
  const confirm  = document.getElementById('confirm').value.trim();

  if (password !== confirm) {
    Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
    return;
  }

  // Obtener token desde la URL
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) {
    Swal.fire('Error', 'Token inválido o faltante.', 'error');
    return;
  }

  try {
    const res = await fetch('backend/reset.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();

    if (data.ok) {
      Swal.fire({
        icon: 'success',
        title: '¡Éxito!',
        text: 'Tu contraseña ha sido restablecida.',
        confirmButtonText: 'Ir al inicio'
      }).then(() => {
        window.location.href = 'index.html';
      });
    } else {
      Swal.fire('Error', data.error || 'No se pudo restablecer la contraseña.', 'error');
    }
  } catch (err) {
    Swal.fire('Error', 'Hubo un problema en el servidor.', 'error');
  }
});
</script>

</body>
</html>
