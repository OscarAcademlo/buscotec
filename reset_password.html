<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | BuscoTec</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<div class="container my-5">
  <h3>Restablecer contraseña</h3>

  <form id="formReset">
    <input type="hidden" id="token">
    <div class="mb-3">
      <label for="password" class="form-label">Nueva contraseña</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div class="mb-3">
      <label for="confirm" class="form-label">Confirmar contraseña</label>
      <input type="password" class="form-control" id="confirm" required>
    </div>
    <button type="submit" class="btn btn-success">Guardar nueva contraseña</button>
  </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('token').value = params.get('token');

document.getElementById('formReset').addEventListener('submit', async function(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const token = document.getElementById('token').value;

  if (password !== confirm) {
    Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
    return;
  }

  try {
    const res = await fetch('backend/reset_password.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();

    if (data.success) {
      Swal.fire('Éxito', 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
    } else {
      Swal.fire('Error', data.error || 'No se pudo restablecer la contraseña.', 'error');
    }
  } catch (err) {
    Swal.fire('Error', 'Hubo un problema en el servidor.', 'error');
  }
});
</script>

</body>
</html>
