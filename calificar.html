<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calificar servicio - BuscoTec</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: .75rem; box-shadow: 0 3px 12px rgba(0,0,0,.08); }
    .stars { font-size: 2rem; cursor: pointer; color: #ccc; user-select:none; }
    .stars .active { color: #ffc107; }
    textarea { resize: none; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="text-center mb-4">
      <h3>⭐ Calificar profesional</h3>
      <p class="text-muted">Tu opinión nos ayuda a mejorar la experiencia en BuscoTec</p>
    </div>

    <div class="card mx-auto p-4" style="max-width: 540px;">
      <div id="infoProfesional" class="mb-3 text-center">
        <h5 id="nombreProfesional">Cargando profesional...</h5>
      </div>

      <div class="mb-3 text-center">
        <div id="ratingStars" class="stars"></div>
        <div class="form-text">Toca una estrella para elegir la calificación</div>
      </div>

      <div class="mb-3">
        <label for="comentario" class="form-label fw-semibold">Comentario (opcional)</label>
        <textarea id="comentario" class="form-control" rows="3" placeholder="Escribe tu experiencia..."></textarea>
      </div>

      <div class="d-grid gap-2">
        <button id="btnEnviar" class="btn btn-primary">Enviar calificación</button>
        <a href="mensajes.html" class="btn btn-outline-secondary">Volver</a>
      </div>
    </div>
  </div>

  <script>
  // === Leer parámetros ===
  const params = new URLSearchParams(window.location.search);
  const casoId = params.get('caso_id') || params.get('id') || params.get('caso');
  const userId = localStorage.getItem('buscotec_user_id'); // ID del usuario logueado

  let rating = 0;

  // === 1️⃣ Validar caso y sesión al inicio ===
  if (!casoId) {
    alert('ID de caso no válido.');
    location.href = 'mensajes.html';
  }

  if (!userId) {
    alert('No se encontró tu sesión. Iniciá sesión nuevamente.');
    location.href = 'index.php';
  }

 // === 2️⃣ Cargar profesional por caso ===
async function cargarProfesional() {
  try {
    const r = await fetch('backend/get_profesional_por_caso.php?caso_id=' + encodeURIComponent(casoId) + '&t=' + Date.now());
    const j = await r.json();

    // ✅ Soporta ambos formatos: {profesional:{...}} o plano {nombre, apellido}
    const pro = j.profesional || j;

    if (j.ok && pro && (pro.nombre || pro.apellido)) {
      document.getElementById('nombreProfesional').textContent = `${pro.nombre || ''} ${pro.apellido || ''}`.trim();
    } else {
      document.getElementById('nombreProfesional').textContent = 'Profesional no encontrado';
    }
  } catch (e) {
    document.getElementById('nombreProfesional').textContent = 'Error al cargar profesional';
    console.error('Error cargarProfesional:', e);
  }
}


  // === 3️⃣ Crear estrellas dinámicamente ===
  const starsEl = document.getElementById('ratingStars');
  for (let i = 1; i <= 5; i++) {
    const star = document.createElement('span');
    star.textContent = '★';
    star.dataset.value = i;
    star.addEventListener('click', () => setRating(i));
    starsEl.appendChild(star);
  }

  function setRating(value) {
    rating = value;
    starsEl.querySelectorAll('span').forEach((s, i) => {
      s.classList.toggle('active', i < value);
    });
  }

  // === 5️⃣ Inicializar ===
  async function init() {
    try {
      // Verificar si ya está calificado
      const r = await fetch(`backend/verificar_calificacion.php?caso_id=${casoId}&t=${Date.now()}`);
      const j = await r.json();
      
      if (j.ok && j.ya_calificado) {
        mostrarGracias();
      } else {
        await cargarProfesional();
      }
    } catch (e) {
      console.error('Error init:', e);
      cargarProfesional();
    }
  }

  function mostrarGracias() {
    const card = document.querySelector('.card');
    card.innerHTML = `
      <div class="text-center py-4">
        <div class="mb-4" style="font-size: 4rem;">✅</div>
        <h4 class="mb-3">¡Gracias por calificar!</h4>
        <p class="text-muted mb-4">Tu opinión ya fue registrada y nos ayuda a brindar un mejor servicio.</p>
        <div class="d-grid">
          <a href="mensajes.html" class="btn btn-primary">Volver a mis mensajes</a>
        </div>
      </div>
    `;
  }

  // === 4️⃣ Enviar calificación ===
  document.getElementById('btnEnviar').addEventListener('click', async () => {
    if (!rating) {
      alert('Por favor, seleccioná una calificación.');
      return;
    }

    const comentario = document.getElementById('comentario').value.trim();
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      const fd = new FormData();
      fd.append('caso_id', casoId);
      fd.append('rating', rating);
      fd.append('comentario', comentario);
      fd.append('emisor_id', userId);

      const r = await fetch('backend/guardar_calificacion.php', { method: 'POST', body: fd });
      const j = await r.json();

      if (j.ok) {
        mostrarGracias();
        // Redirigir después de unos segundos para que vea el mensaje
        setTimeout(() => {
          location.href = 'mensajes.html';
        }, 3000);
      } else {
        alert('⚠️ ' + (j.error || 'No se pudo guardar la calificación.'));
        btn.disabled = false;
        btn.textContent = 'Enviar calificación';
      }
    } catch (e) {
      alert('Error al conectar con el servidor.');
      console.error(e);
      btn.disabled = false;
      btn.textContent = 'Enviar calificación';
    }
  });

  init();
  </script>
</body>
</html>
