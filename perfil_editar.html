<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Perfil | BuscoTec</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      background: white;
      width: 100%;
      max-width: 600px;
      margin: 20px;
    }

    .titulo {
      font-weight: 700;
      color: #0d6efd;
    }

    .form-label {
      font-weight: 600;
      margin-top: 5px;
      color: #495057;
    }

    .input-group-text {
      background-color: #f8f9fa;
      border-left: none;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
    }
  </style>
</head>

<body>

  <div class="container d-flex justify-content-center">
    <div class="card p-4">

      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h3 class="mb-0 titulo"><i class="bi bi-person-gear"></i> Editar Perfil</h3>
        <a href="perfil_ver.html" class="btn btn-outline-secondary btn-sm px-3" style="position: relative; z-index: 10;">Cancelar</a>
      </div>

      <form id="formEditar">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Tu apellido" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email de contacto</label>
          <div class="input-group">
            <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
            <span class="input-group-text text-success"><i class="bi bi-check-circle-fill"></i></span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">WhatsApp (Sin el +)</label>
          <input type="tel" id="whatsapp" name="whatsapp" class="form-control" placeholder="Ej: 2944651381" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección (Calle y Nro)</label>
          <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Ej: Mitre 123">
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Barrio</label>
            <input type="text" id="barrio" name="barrio" class="form-control" placeholder="Barrio">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Ciudad</label>
            <input type="text" id="ciudad" name="ciudad" class="form-control" placeholder="Ciudad">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Provincia</label>
            <input type="text" id="provincia" name="provincia" class="form-control" placeholder="Provincia">
          </div>
        </div>

        <!-- Sección Profesional (Solo se muestra si es profesional) -->
        <div id="profData" class="d-none border-top pt-3 mt-3">
          <h5 class="mb-3 text-secondary">Datos de Profesional</h5>

          <div class="mb-3">
            <label class="form-label">Categorías de Servicio</label>
            <div id="categorias-container" class="border rounded p-3 bg-light"
              style="max-height: 250px; overflow-y: auto;">
              <span class="text-muted">Cargando categorías...</span>
            </div>
            <div class="form-text">Seleccioná los rubros que atendés (podés marcar varios).</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Años de experiencia</label>
            <input type="number" id="experiencia" name="experiencia" class="form-control" placeholder="Años">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción breve</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3"
              placeholder="Contanos qué hacés..."></textarea>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-3 fs-5 mt-4 fw-bold">Guardar
          Cambios</button>
      </form>

    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    async function loadData() {
      try {
        // Ejecutar peticiones en paralelo para mayor velocidad
        const [rCats, rPerfil] = await Promise.all([
          fetch('backend/get_categorias.php'),
          fetch('backend/get_perfil.php', { credentials: 'include' })
        ]);

        const jCats = await rCats.json();
        const jPerfil = await rPerfil.json();

        // 1. Renderizar Categorías
        const container = $('categorias-container');
        if (jCats.ok && jCats.items) {
          if (jCats.items.length > 0) {
            let html = '';
            jCats.items.forEach(c => {
              html += `
                <div class="form-check mb-1">
                  <input class="form-check-input" type="checkbox" name="categorias[]" value="${c.id}" id="cat_${c.id}">
                  <label class="form-check-label" for="cat_${c.id}">
                    ${c.nombre}
                  </label>
                </div>
              `;
            });
            container.innerHTML = html;
          } else {
            container.innerHTML = '<div class="text-danger">No hay categorías disponibles.</div>';
          }
        }

        // 2. Llenar Formulario con Datos del Perfil
        if (jPerfil.ok && jPerfil.data) {
          const u = jPerfil.data.usuario || jPerfil.data.profesional;

          if (u) {
            $('nombre').value = u.nombre || '';
            $('apellido').value = u.apellido || '';
            $('email').value = u.email || '';
            $('whatsapp').value = u.whatsapp || '';
            $('direccion').value = u.direccion || '';
            $('barrio').value = u.barrio || '';
            $('ciudad').value = u.ciudad || '';
            $('provincia').value = u.provincia || '';

            // Si es profesional
            if (jPerfil.data.profesional) {
              $('profData').classList.remove('d-none');
              $('experiencia').value = jPerfil.data.profesional.experiencia || '';
              $('descripcion').value = jPerfil.data.profesional.descripcion || '';

              // Marcar categorías seleccionadas
              const misCats = jPerfil.data.profesional.categorias || [];
              const legacyCat = jPerfil.data.profesional.categoria_id; // Por si acaso

              if (Array.isArray(misCats)) {
                misCats.forEach(id => {
                  const chk = document.getElementById(`cat_${id}`);
                  if (chk) chk.checked = true;
                });
              } else if (legacyCat) {
                // Fallback visual si categorias viene vacío pero categoria_id existe
                const chk = document.getElementById(`cat_${legacyCat}`);
                if (chk) chk.checked = true;
              }
            }
          }
        } else {
          // Sin sesión
          console.warn("Sesión expirada o inválida");
          // window.location.href = 'login.html'; // Opcional: redirigir
        }

      } catch (e) {
        console.error("Error al cargar datos:", e);
        Swal.fire('Error', 'No se pudieron cargar los datos del perfil.', 'error');
      }
    }

    $('formEditar').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData($('formEditar'));
      const btn = $('btnSubmit');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const res = await fetch('backend/editar_perfil.php', {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        const data = await res.json();

        if (data.ok) {
          Swal.fire({
            icon: 'success',
            title: '¡Cambios guardados!',
            text: data.msg || 'Tu perfil se actualizó correctamente.',
            timer: 2000,
            showConfirmButton: false,
            heightAuto: false
          }).then(() => {
            window.location.href = 'perfil_ver.html';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Error de Sesión',
            html: (data.error || 'No se pudo actualizar el perfil.') + '<br><br><b>¿Quizás expiró tu sesión?</b> Intenta volver a entrar.',
            confirmButtonText: 'Ir al Login',
            showCancelButton: true,
            cancelButtonText: 'Cerrar',
            heightAuto: false
          }).then((res) => {
            if (res.isConfirmed) window.location.href = 'login.html';
          });
        }
      } catch (err) {
        console.error("Error en POST:", err);
        Swal.fire({
          icon: 'error',
          title: 'Error de conexión',
          text: 'Ocurrió un error al intentar contactar con el servidor.',
          heightAuto: false
        });
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>

</body>

</html>
