<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión | BuscoTec</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1877f2 40%, #0d47a1);
      color: #fff;
      text-align: center;
      font-family: "Inter", -apple-system, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-offline {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    img {
      width: 140px;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn-retry {
      background-color: #fff;
      color: #1877f2;
      border: none;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 50px;
      width: 100%;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .btn-retry:hover {
      background-color: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card-offline">
    <img src="img/logo_web.png" alt="BuscoTec">
    <h1>Estás sin conexión</h1>
    <p>No hemos podido conectar con el servidor. Verificá tu conexión a Internet.</p>
    <button class="btn-retry" id="retryBtn" onclick="handleRetry()">Reintentar conexión</button>
    <div class="footer-note" onclick="deepRefresh()">¿Sigues con problemas? Toca acá para limpiar cache.</div>
  </div>

  <script>
    // 1. Detección automática al recuperar conexión
    window.addEventListener('online', () => {
      console.log("🌐 Conexión recuperada, recargando...");
      location.reload();
    });

    async function handleRetry() {
      const btn = document.getElementById('retryBtn');
      btn.innerText = "Verificando...";
      btn.disabled = true;
      
      // Pequeño delay para que el usuario vea la acción
      setTimeout(() => {
        if (navigator.onLine) {
          location.reload();
        } else {
          btn.innerText = "Reintentar conexión";
          btn.disabled = false;
          alert("Parece que seguís sin conexión. Verificá tu Wi-Fi o datos móviles.");
        }
      }, 800);
    }

    // 2. Limpieza profunda (Fix para Safari "stuck")
    async function deepRefresh() {
      if (confirm("Esto limpiará la cache local de la App para intentar resolver el problema de conexión. ¿Continuar?")) {
        try {
          // Desregistrar SW
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let r of regs) await r.unregister();
          }
          // Limpiar caches
          if (window.caches) {
            const keys = await caches.keys();
            for (let k of keys) await caches.delete(k);
          }
          // Recargar con cache busting
          window.location.href = "/?refresh=" + Date.now();
        } catch (e) {
          location.reload();
        }
      }
    }
  </script>
</body>
</html>
